name: Headroom 4452 preparation smoke a26d (non-counted)

on:
  push:
    branches:
      - smoke-headroom4452-7e5efedc-a26d

permissions:
  contents: read

concurrency:
  group: smoke-headroom4452-7e5efedc-a26d
  cancel-in-progress: false

jobs:
  prepare:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [source-gates, python-proof, rust-workspace, ci-python-commitlint]
    steps:
      - name: Checkout smoke payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout frozen PR head only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: leninworld/headroom
          ref: c79ba62c19b63f921d52aa7f507c2fe06c16756a
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Build lane image and probe prepared assets offline
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -I -B diagnostic/validation/headroom4452/smoke.py
          --lane "${{ matrix.lane }}" --source "$GITHUB_WORKSPACE/src"
          --evidence "$RUNNER_TEMP/headroom4452-smoke-${{ matrix.lane }}"
      - name: Upload preparation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headroom4452-a26d-smoke-${{ github.run_id }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/headroom4452-smoke-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 7
